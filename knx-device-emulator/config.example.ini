# Example configuration with all the supported keys.
# Copy it to config.ini and edit it for your own environment.

[knx]
# connection: tunneling (to a specific IP gateway) | routing (multicast)
connection   = tunneling
gateway_ip   = 192.168.1.10      ; the IP of your KNXnet/IP device (for tunneling)
gateway_port = 3671
# local_ip   = 192.168.1.50      ; SET explicitly an address from the gateway subnet if you get
                                 ; 'L_DATA_CON ... confirmation timed out' — a common cause
# route_back = true              ; enable it with NAT/routing between the host and the gateway

[control]
# transport: rest | cli
transport = rest
host      = 0.0.0.0
port      = 8080

# --- Devices: the section name = the instance name, type = a plugin from devices/ ---

[outlet0]
type     = outlet
Action   = 1/1/1                 ; the on/off command arrives here (DPT 1.001)
Status   = 2/2/2                 ; the status is read from / sent to here
Inverted = True                  ; inversion of the physical state relative to the bus

[dimmer_kitchen]
type      = dimmer
Action    = 1/2/1                ; on/off (DPT 1.001)
ActionDim = 1/2/2                ; level 0..100 % (DPT 5.001)
Status    = 2/2/1
StatusDim = 2/2/2

[thermostat_room]
type           = thermostat
ActionOnOff    = 1/3/1           ; on/off (DPT 1.001)
StatusOnOff    = 2/3/1
ActionSetpoint = 1/3/2           ; target temperature (DPT 9.001)
StatusSetpoint = 2/3/2
StatusCurrent  = 2/3/3           ; current temperature (DPT 9.001)
ActionMode     = 1/3/4           ; target mode (DPT 20.105) — Control only
                                 ; 1=off, 2=heat, 3=cool, 4=auto
StatusMode     = 2/3/4           ; current mode (mirrors the target one)
; --- summer/winter mode: optional, changed from the panel only (DPT 1.100) ---
; NOTE: while a season is active the auto mode is unavailable — the season sets the direction.
; Remove StatusSeason so that the thermostat can choose heating/cooling itself.
StatusSeason   = 2/3/5           ; remove this line to disable the seasonal mode
Season         = winter          ; the initial season (summer | winter)
Mode           = off             ; the initial mode (off | heat | cool | auto*)
Setpoint       = 21.0
Current        = 19.0
AutoHysteresis = 0.5             ; the auto dead band, °C (0.5 by default)
CycleSec       = 30              ; the cyclic broadcast period of the current temperature

[ac_livingroom]
# Air conditioner = thermostat + fan (percent 0..100, DPT 5.001)
type           = air_conditioner
ActionOnOff    = 1/4/1
StatusOnOff    = 2/4/1
ActionSetpoint = 1/4/2
StatusSetpoint = 2/4/2
StatusCurrent  = 2/4/3
ActionMode     = 1/4/4
StatusMode     = 2/4/4
StatusSeason   = 2/4/6           ; optional (as for the thermostat); while it is set,
Season         = summer          ; the auto mode (option 4) is unavailable
ActionFan      = 1/4/5           ; set the fan speed 0..100 %
StatusFan      = 2/4/5           ; the speed status
Mode           = off
Setpoint       = 24.0
Current        = 27.0
Fan            = 50              ; the initial fan speed
CycleSec       = 30

[air_quality0]
# Air quality sensor: every sensor is enabled independently — the one whose
# Status is set is present (like the sensor_*_enabled flags in Matter firmware).
type        = air_quality_sensor
StatusAQI   = 3/0/1              ; air quality index 0..255 (DPT 5.010)
StatusCH2O  = 3/0/2              ; formaldehyde, ppm (DPT 9.008)
StatusTVOC  = 3/0/3             ; volatile organic compounds, ppm (DPT 9.008)
StatusPM1   = 3/0/4              ; PM1.0, µg/m³ (DPT 9.030)
StatusPM2_5 = 3/0/5             ; PM2.5, µg/m³ (DPT 9.030)
StatusPM10  = 3/0/6              ; PM10, µg/m³ (DPT 9.030)
StatusCO2   = 3/0/7              ; CO2, ppm (DPT 9.008)
AQI         = 50                ; the initial values (optional)
CO2         = 400
CycleSec    = 60                ; the cyclic broadcast period (0/absent — off)
