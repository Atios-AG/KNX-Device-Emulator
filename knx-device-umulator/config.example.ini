# Пример конфигурации со всеми поддерживаемыми ключами.
# Скопируйте в config.ini и отредактируйте под своё окружение.

[knx]
# connection: tunneling (к конкретному IP-шлюзу) | routing (multicast)
connection   = tunneling
gateway_ip   = 192.168.1.10      ; IP вашего KNXnet/IP устройства (для tunneling)
gateway_port = 3671
# local_ip   = 192.168.1.50      ; ЗАДАЙТЕ явно адрес из подсети шлюза, если ловите
                                 ; 'L_DATA_CON ... confirmation timed out' — частая причина
# route_back = true              ; включите при NAT/маршрутизации между хостом и шлюзом

[control]
# transport: rest | cli
transport = rest
host      = 0.0.0.0
port      = 8080

# --- Устройства: имя секции = имя инстанса, type = плагин из devices/ --------

[outlet0]
type     = outlet
Action   = 1/1/1                 ; сюда приходит команда вкл/выкл (DPT 1.001)
Status   = 2/2/2                 ; отсюда читается / шлётся статус
Inverted = True                  ; инверсия физического состояния относительно шины

[dimmer_kitchen]
type      = dimmer
Action    = 1/2/1                ; вкл/выкл (DPT 1.001)
ActionDim = 1/2/2                ; уровень 0..100 % (DPT 5.001)
Status    = 2/2/1
StatusDim = 2/2/2

[thermostat_room]
type           = thermostat
ActionOnOff    = 1/3/1           ; вкл/выкл (DPT 1.001)
StatusOnOff    = 2/3/1
ActionSetpoint = 1/3/2           ; целевая температура (DPT 9.001)
StatusSetpoint = 2/3/2
StatusCurrent  = 2/3/3           ; текущая температура (DPT 9.001)
ActionMode     = 1/3/4           ; целевой режим off/heat/cool (DPT 20.105) — только Control
StatusMode     = 2/3/4           ; текущий режим (зеркалит целевой)
; --- летний/зимний режим: опционально, меняется только с панели (DPT 1.100) ---
StatusSeason   = 2/3/5           ; убрать эту строку, чтобы отключить сезонный режим
Season         = winter          ; начальный сезон (summer | winter)
Mode           = off             ; начальный режим (off | heat | cool)
Setpoint       = 21.0
Current        = 19.0
CycleSec       = 30              ; период циклической рассылки текущей температуры

[ac_livingroom]
# Кондиционер = термостат + вентилятор (проценты 0..100, DPT 5.001)
type           = air_conditioner
ActionOnOff    = 1/4/1
StatusOnOff    = 2/4/1
ActionSetpoint = 1/4/2
StatusSetpoint = 2/4/2
StatusCurrent  = 2/4/3
ActionMode     = 1/4/4
StatusMode     = 2/4/4
StatusSeason   = 2/4/6           ; опционально (как у термостата)
Season         = summer
ActionFan      = 1/4/5           ; задать скорость вентилятора 0..100 %
StatusFan      = 2/4/5           ; статус скорости
Mode           = off
Setpoint       = 24.0
Current        = 27.0
Fan            = 50              ; начальная скорость вентилятора
CycleSec       = 30

[air_quality0]
# Сенсор качества воздуха: каждый датчик включается независимо — присутствует
# тот, чей Status задан (как флаги sensor_*_enabled в Matter-прошивке).
type        = air_quality_sensor
StatusAQI   = 3/0/1              ; индекс качества воздуха 0..255 (DPT 5.010)
StatusCH2O  = 3/0/2              ; формальдегид, ppm (DPT 9.008)
StatusTVOC  = 3/0/3             ; летучие орг. соединения, ppm (DPT 9.008)
StatusPM1   = 3/0/4              ; PM1.0, µg/m³ (DPT 9.030)
StatusPM2_5 = 3/0/5             ; PM2.5, µg/m³ (DPT 9.030)
StatusPM10  = 3/0/6              ; PM10, µg/m³ (DPT 9.030)
StatusCO2   = 3/0/7              ; CO2, ppm (DPT 9.008)
AQI         = 50                ; начальные значения (опционально)
CO2         = 400
CycleSec    = 60                ; период циклической рассылки (0/нет — выкл.)
